<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harian Saibatin — Kanal Berita Terpercaya Nusantara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f1b3d;--red:#a50e1f;--ink:#1c1c22;--mute:#6b6f7a;--line:#e3e4e8;--bg:#fff;--soft:#efeff1;--serif:'Playfair Display',Georgia,serif;--sans:Roboto,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--navy:#e8ebf5;--ink:#ececf0;--mute:#9a9eab;--line:#2c2f3a;--bg:#14161d;--soft:#1e212b}}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.5}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.topbar{background:var(--soft);font-size:13px;padding:6px 0}
header .row{display:flex;align-items:center;gap:28px;padding:14px 0;flex-wrap:wrap}
.logo{font-family:var(--serif);font-weight:800;font-size:30px;color:var(--navy);letter-spacing:.5px;line-height:1}
.logo small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;letter-spacing:0;color:var(--ink);margin-top:3px}
nav{display:flex;gap:20px;font-weight:500;font-size:15px;flex-wrap:wrap}
nav a{padding:4px 0;border-bottom:2px solid transparent}nav a:hover,nav a.on{border-color:var(--red)}
.tools{margin-left:auto;display:flex;gap:10px}
.tools input{border:0;background:var(--soft);color:var(--ink);padding:8px 12px;border-radius:6px;width:170px;font:inherit;font-size:14px}
.btn{background:var(--red);color:#fff;border:0;padding:8px 16px;border-radius:6px;font-weight:500}
.breaking{background:var(--soft);border-top:1px solid var(--line)}
.breaking .wrap{display:flex;align-items:center;gap:16px}
.breaking b{background:var(--red);color:#fff;padding:10px 16px;font-size:17px;white-space:nowrap}
.breaking span{font-weight:500}
.main{display:grid;grid-template-columns:1.25fr 1fr .7fr;gap:24px;margin:26px 0}
.img{background:linear-gradient(135deg,#3a4a7a,#a50e1f 140%) center/cover;border-radius:10px;position:relative;overflow:hidden}
.hero .img{aspect-ratio:4/3.2;height:100%;min-height:260px}
.tag{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:4px}
.hero h1{font-family:var(--serif);font-size:31px;line-height:1.2;margin:12px 0;color:var(--navy);cursor:pointer}
.hero p{font-size:14px}.time{color:var(--mute);font-size:13px;margin-top:10px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:6px;font-weight:500;color:var(--mute)}
.tabs button.on{color:var(--ink);border-color:var(--red)}
.list{list-style:none;padding:0}
.list li{display:flex;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:500;cursor:pointer}
.list li:hover{color:var(--red)}.list em{color:var(--red);font-style:normal;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:40px}
.card{aspect-ratio:1/1.05;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:#fff;border:0;text-align:left}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.8))}
.card>*{position:relative}.card .tag{background:var(--navy);color:var(--bg);align-self:flex-start}
.card h3{font-size:16px;line-height:1.25}
dialog{border:0;border-radius:12px;max-width:620px;width:92%;padding:26px;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{font-family:var(--serif);color:var(--navy);margin:10px 0}
dialog p{margin-top:12px;white-space:pre-line}
dialog input{width:100%;padding:10px;margin:12px 0;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--ink);font:inherit}
.msg{font-size:14px;min-height:20px}
@media(max-width:820px){.main{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.tools{margin-left:0;width:100%}.tools input{flex:1}}
@media(max-width:480px){.cards{grid-template-columns:1fr}.breaking b{font-size:13px;padding:8px 10px}}
</style>
</head>
<body>
<div class="topbar"><div class="wrap" id="date"></div></div>
<header><div class="wrap row">
  <a class="logo" href="/">HARIAN SAIBATIN<small>Kanal Berita Terpercaya Nusantara</small></a>
  <nav id="nav"><a href="#" data-c="" class="on">Beranda</a></nav>
  <div class="tools">
    <input id="q" type="search" placeholder="Cari berita..." aria-label="Cari berita">
    <button class="btn" id="subBtn">Langganan</button>
  </div>
</div></header>
<div class="breaking"><div class="wrap"><b>BREAKING NEWS</b><span id="breaking"></span></div></div>

<main class="wrap">
  <section class="main">
    <article class="hero" id="hero" style="display:contents"></article>
    <aside>
      <div class="tabs"><button class="on" data-s="latest">TERKINI</button><button data-s="popular">TERPOPULER</button></div>
      <ol class="list" id="side"></ol>
    </aside>
  </section>
  <section class="cards" id="cards"></section>
</main>

<dialog id="artDlg"><div id="artBody"></div><button class="btn" onclick="artDlg.close()">Tutup</button></dialog>
<dialog id="subDlg">
  <h2>Berlangganan Harian Saibatin</h2>
  <p>Masukkan email Anda untuk menerima ringkasan berita setiap pagi.</p>
  <input id="email" type="email" placeholder="nama@email.com" aria-label="Email">
  <div class="msg" id="subMsg" role="status"></div>
  <button class="btn" id="subGo">Berlangganan</button>
  <button class="btn" style="background:var(--mute)" onclick="subDlg.close()">Batal</button>
</dialog>

<script>
const $=s=>document.querySelector(s);
const api=(u,o)=>fetch(u,o).then(async r=>{const d=r.status===204?null:await r.json();if(!r.ok)throw new Error(d?.error||'Gagal');return d});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bg=a=>a.image?`style="background-image:url('${esc(a.image)}')"`:'';
const ago=d=>{const m=Math.max(1,Math.round((Date.now()-new Date(d))/6e4));return m<60?`${m} Menit yang Lalu`:m<1440?`${Math.round(m/60)} Jam yang Lalu`:new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})};
let cat='',sort='latest',term='';
$('#date').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

async function init(){
  const [cats,br]=await Promise.all([api('/api/categories'),api('/api/breaking')]);
  $('#breaking').textContent=br;
  $('#nav').insertAdjacentHTML('beforeend',cats.map(c=>`<a href="#" data-c="${c}">${c}</a>`).join(''));
  $('#nav').onclick=e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();cat=a.dataset.c;document.querySelectorAll('#nav a').forEach(x=>x.classList.toggle('on',x===a));render()};
  render();
}
async function render(){
  const qs=new URLSearchParams({category:cat,q:term});
  try{
    const all=await api('/api/articles?'+qs);
    const feat=all.find(a=>a.featured)||all[0];
    $('#hero').innerHTML=feat?`<div class="img" ${bg(feat)}></div>
      <div><span class="tag">${esc(feat.category)}</span><h1 tabindex="0" data-id="${feat.id}">${esc(feat.title)}</h1><p>${esc(feat.summary)}</p><div class="time">${ago(feat.publishedAt)}</div></div>`
      :'<p>Tidak ada berita yang cocok. Coba kata kunci lain.</p>';
    const cards=all.filter(a=>a!==feat).slice(0,4);
    $('#cards').innerHTML=cards.map(a=>`<button class="img card" ${bg(a)} data-id="${a.id}"><span class="tag">${esc(a.category)}</span><h3>${esc(a.title)}</h3></button>`).join('');
    side();
  }catch(e){$('#hero').innerHTML=`<p>${esc(e.message)}</p>`}
}
async function side(){
  const l=await api(`/api/articles?sort=${sort}&limit=5`+(term?'&q='+encodeURIComponent(term):''));
  $('#side').innerHTML=l.map((a,i)=>`<li tabindex="0" data-id="${a.id}"><em>${i+1}.</em><span>${esc(a.title)}</span></li>`).join('');
}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;sort=b.dataset.s;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));side()};
let t;$('#q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{term=e.target.value.trim();render()},300)};
async function open(id){
  const a=await api('/api/articles/'+id);
  $('#artBody').innerHTML=`<span class="tag">${esc(a.category)}</span><h2>${esc(a.title)}</h2><div class="time">${ago(a.publishedAt)} · ${a.views} kali dibaca</div><p>${esc(a.body||a.summary)}</p><br>`;
  artDlg.showModal();
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-id]');if(el)open(el.dataset.id)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const el=e.target.closest?.('[data-id]');if(el)open(el.dataset.id)}});
$('#subBtn').onclick=()=>{$('#subMsg').textContent='';subDlg.showModal()};
$('#subGo').onclick=async()=>{
  try{const r=await api('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value})});$('#subMsg').textContent=r.message}
  catch(e){$('#subMsg').textContent=e.message}
};
init();
</script>
</body>
</html>
